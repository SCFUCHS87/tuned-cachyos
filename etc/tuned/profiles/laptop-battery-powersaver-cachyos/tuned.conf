[main]
summary=Battery powersaver for laptops on CachyOS (max runtime)
include=powersave

[cpu]
governor=powersave
energy_perf_bias=balance_power
min_perf_pct=15
max_perf_pct=80
turbo=1

[vm]
transparent_hugepages=madvise

[sysctl]
vm.swappiness=60
vm.dirty_background_bytes=67108864     # 64 MiB
vm.dirty_bytes=268435456               # 256 MiB

[audio]
timeout=10

[usb]
autosuspend=1

[script]
script=${i:PROFILE_DIR}/scripts/pci-pm.sh
